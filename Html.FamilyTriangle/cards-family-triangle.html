<html>
  <head>
    <link rel="stylesheet" href="css/cards-family-triangle.css" />
    <link rel="stylesheet" href="css/images.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/card.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/main.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/image.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/triangle_cards.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Special+Elite"
      rel="stylesheet"
    />

    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <style type="text/css"></style>
  </head>

  <body id="body">
    <!-- configure Dojo -->
    <script>
      // Instead of using data-dojo-config, we're creating a dojoConfig
      // object *before* we load dojo.js; they're functionally identical,
      // it's just easier to read this approach with a larger configuration.
      var dojoConfig = {
        baseUrl: ".",
        async: true,
        // This code registers the correct location of the "demo"
        // package so we can load Dojo from the CDN whilst still
        // being able to load local modules
        packages: [
          { name: "dojo", location: "../../bower_components/dojo" },
          { name: "javascript", location: "javascript" },
          {
            name: "sharedJavascript",
            location: "SharedWebBoardgame/javascript",
          },
        ],
      };
    </script>
    <!-- load Dojo -->
    <script src="../../bower_components/dojo/dojo.js"></script>

    <script>
      require([
        "sharedJavascript/cards",
        "sharedJavascript/debugLog",
        "sharedJavascript/genericMeasurements",
        "sharedJavascript/htmlUtils",
        "sharedJavascript/systemConfigs",
        "sharedJavascript/triangleCards",
        "javascript/cardsFamilyTriangleData",
      ], function (
        cards,
        debugLogModule,
        genericMeasurements,
        htmlUtils,
        systemConfigs,
        triangleCards,
        cardsFamilyTriangleData,
      ) {
        var debugLog = debugLogModule.debugLog;

        var cardHeightPx = genericMeasurements.triangleCardTTSActualHeightPx;

        var sc = systemConfigs.getCardSystemConfigs({
          cardHeightPx: cardHeightPx,
        });

        systemConfigs.setSystemConfigs(sc);

        cardsFamilyTriangleData.generateCardConfigs();
        var numCards = cardsFamilyTriangleData.getNumCards();

        var backConfig = {
          callback: function (parentNode, index) {
            var cardBack = triangleCards.addCardBack(
              parentNode,
              cardConfigs,
              index,
            );

            htmlUtils.addDiv(
              cardBack,
              ["deck-label"],
              "deckLabel",
              deckConfig.deckLabel,
            );
          },
          classes: ["hoa"],
        };

        var backConfigs = [];
        var configs = cardsFamilyTriangleData.getCardConfigs();
        cards.addCards(
          numCards,
          function (parentNode, index) {
            return triangleCards.addCardFront(parentNode, configs, index);
          },
          backConfigs,
        );
      });
    </script>
  </body>
</html>
