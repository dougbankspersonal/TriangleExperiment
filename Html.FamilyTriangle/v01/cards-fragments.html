<html>
  <head>
    <base href="../" />
    <title>Cards: Fragments</title>
    <link rel="stylesheet" href="css/cards-fragments.css" />
    <link rel="stylesheet" href="css/images.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/cards.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/main.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/image.css" />
    <link rel="stylesheet" href="SharedWebBoardGame/css/triangle-cards.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <style type="text/css"></style>
  </head>

  <body id="body">
    <!-- configure Dojo -->
    <script>
      // Instead of using data-dojo-config, we're creating a dojoConfig
      // object *before* we load dojo.js; they're functionally identical,
      // it's just easier to read this approach with a larger configuration.
      var dojoConfig = {
        baseUrl: ".",
        async: true,
        // This code registers the correct location of the "demo"
        // package so we can load Dojo from the CDN whilst still
        // being able to load local modules
        packages: [
          { name: "dojo", location: "../../bower_components/dojo" },
          { name: "javascript", location: "javascript" },
          {
            name: "sharedJavascript",
            location: "SharedWebBoardgame/javascript",
          },
        ],
      };
    </script>
    <!-- load Dojo -->
    <script src="../../bower_components/dojo/dojo.js"></script>

    <script>
      require([
        "sharedJavascript/cards",
        "sharedJavascript/debugLog",
        "sharedJavascript/genericMeasurements",
        "sharedJavascript/genericUtils",
        "sharedJavascript/htmlUtils",
        "sharedJavascript/systemConfigs",
        "sharedJavascript/triangleCards",
        "javascript/cardsFragments",
        "javascript/cardsFragmentsData",
        "javascript/gameInfo",
      ], function (
        cards,
        debugLogModule,
        genericMeasurements,
        genericUtils,
        htmlUtils,
        systemConfigs,
        triangleCards,
        cardsFragments,
        cardsFragmentsData,
        gameInfo,
      ) {
        const screentopScale = 0.5;

        var debugLog = debugLogModule.debugLog;
        var cardHeightPx =
          genericMeasurements.triangleCardScreentopActualHeightPx;

        var sc;
        var queryParams = genericUtils.getCommonQueryParams();

        debugLog("html", "queryParams = ", JSON.stringify(queryParams));

        if (queryParams.isScreentop) {
          sc = systemConfigs.getCardSystemConfigs({
            cardHeightPx: cardHeightPx,
            itemsPerRow: 10,
          });
        } else {
          var cardWidthPx =
            genericMeasurements.standardCardWidthPx * screentopScale;
          cardHeightPx = cardHeightPx * screentopScale;
          debugLog("html", "cardWidthPx = ", cardWidthPx);
          debugLog("html", "cardHeightPx = ", cardHeightPx);
          sc = systemConfigs.getCardSystemConfigs({
            cardHeightPx: cardHeightPx,
            cardWidthPx: cardWidthPx,
            itemsPerRow: 10,
          });
        }
        debugLog("html", "sc before setting = ", JSON.stringify(sc));
        systemConfigs.setSystemConfigs(sc);

        var sc = systemConfigs.getSystemConfigs();
        debugLog("html", "systemConfigs = ", JSON.stringify(sc));

        debugLog(
          "html",
          "genericMeasurements.triangleCardScreentopActualHeightPx = ",
          genericMeasurements.triangleCardScreentopActualHeightPx,
        );

        var numCards = cardsFragmentsData.getNumCards();

        var backConfigs = [];
        for (let i = 0; i < numCards; i++) {
          var backConfig = {
            callback: function (parentNode) {
              debugLog("html", "adding back card for index = ", i);
              return cardsFragments.addCardFront(parentNode, i, true);
            },
          };
          backConfigs.push(backConfig);
        }
        debugLog("html", "backConfigs = ", JSON.stringify(backConfigs));

        cards.addCards(numCards, cardsFragments.addCardFront, backConfigs);
      });
    </script>
  </body>
</html>
