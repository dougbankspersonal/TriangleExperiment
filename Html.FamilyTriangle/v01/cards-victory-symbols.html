<html>
  <head>
    <title>Cards: Victory Symbols</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/main.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/image.css" />
    <link rel="stylesheet" href="../SharedWebBoardGame/css/cards.css" />
    <link rel="stylesheet" href="../css/images.css" />
    <link rel="stylesheet" href="../css/cards-victory.css" />
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <style type="text/css"></style>
  </head>

  <body class="c1 doc-content" id="body">
    <!-- configure Dojo -->
    <script>
      // Instead of using data-dojo-config, we're creating a dojoConfig
      // object *before* we load dojo.js; they're functionally identical,
      // it's just easier to read this approach with a larger configuration.
      var dojoConfig = {
        baseUrl: "..",
        async: true,
        // This code registers the correct location of the "demo"
        // package so we can load Dojo from the CDN whilst still
        // being able to load local modules
        packages: [
          { name: "dojo", location: "../../bower_components/dojo" },
          { name: "javascript", location: "javascript" },
          {
            name: "sharedJavascript",
            location: "SharedWebBoardgame/javascript",
          },
        ],
      };
    </script>
    <!-- load Dojo -->
    <script src="../../../bower_components/dojo/dojo.js"></script>

    <script>
      require([
        "dojo/dom",
        "sharedJavascript/cards",
        "sharedJavascript/debugLog",
        "sharedJavascript/genericMeasurements",
        "sharedJavascript/systemConfigs",
        "javascript/cardsVictory",
        "javascript/cardsVictoryData",
      ], function (
        dom,
        cards,
        debugLogModule,
        genericMeasurements,
        systemConfigs,
        cardsVictory,
        cardsVictoryData,
      ) {
        var debugLog = debugLogModule.debugLog;
        var cardWidthPx = 250;
        var cardHeightPx = 250;

        var sc = systemConfigs.getCardSystemConfigs({
          cardHeightPx: cardHeightPx,
          cardWidthPx: cardWidthPx,
          itemsPerRow: 10,
        });

        systemConfigs.setSystemConfigs(sc);

        var numCards = cardsVictoryData.getNumCardsVictorySymbols();

        var cardConfigs = cardsVictoryData.getCardsVictorySymbolConfigs();

        var backConfigs = cardsVictoryData.getBackConfigs();
        cards.addCards(
          numCards,
          function (parentNode, index) {
            return cardsVictory.addCardFront(parentNode, cardConfigs, index);
          },
          backConfigs,
        );
      });
    </script>
  </body>
</html>
